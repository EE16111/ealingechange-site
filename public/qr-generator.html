<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ealing Exchange QR Code</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a365d 0%, #2d3748 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .qr-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
        }
        .logo-text {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .logo-ealing {
            color: #1a365d;
        }
        .logo-exchange {
            color: #f0b429;
        }
        .tagline {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .qr-container {
            background: linear-gradient(135deg, #1a365d, #2d4a7c);
            padding: 20px;
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 20px;
        }
        #qrcode {
            background: white;
            padding: 15px;
            border-radius: 12px;
        }
        #qrcode canvas {
            display: block !important;
        }
        .scan-text {
            color: #1a365d;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .url-text {
            color: #64748b;
            font-size: 12px;
            word-break: break-all;
        }
        .currency-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            font-size: 24px;
            color: #f0b429;
        }
        .download-btn {
            background: linear-gradient(135deg, #f0b429 0%, #d69e2e 100%);
            color: #1a365d;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(240, 180, 41, 0.4);
        }
    </style>
</head>
<body>
    <div class="qr-card">
        <div class="logo-text">
            <span class="logo-ealing">Ealing</span> <span class="logo-exchange">Exchange</span>
        </div>
        <p class="tagline">Best Rates Guaranteed in West London</p>
        
        <div class="qr-container">
            <div id="qrcode"></div>
        </div>
        
        <p class="scan-text">📱 Scan to visit our website</p>
        <p class="url-text">sys-34584539868966162311959642.web.app</p>
        
        <div class="currency-icons">
            <span>£</span>
            <span>€</span>
            <span>$</span>
            <span>¥</span>
        </div>
        
        <button class="download-btn" onclick="downloadQR()">⬇️ Download QR Code</button>
    </div>

    <script>
        // Generate QR code
        const url = 'https://sys-34584539868966162311959642.web.app/';
        
        QRCode.toCanvas(url, {
            width: 200,
            margin: 0,
            color: {
                dark: '#1a365d',
                light: '#ffffff'
            },
            errorCorrectionLevel: 'H'
        }, function(error, canvas) {
            if (error) console.error(error);
            document.getElementById('qrcode').appendChild(canvas);
        });

        function downloadQR() {
            const canvas = document.querySelector('#qrcode canvas');
            const link = document.createElement('a');
            link.download = 'ealing-exchange-qr-code.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
